# dashboard.toml —— Traefik 动态配置（由 file provider 加载）
# 占位符 __XXX__ 由 install.sh 替换

# 定义 HTTP 路由规则
[http.routers.dashboard]
  rule = "Host(`__DASH_BOARD_DOMAIN__`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
  entryPoints = ["websecure"]
  service = "api@internal"
  middlewares = ["traefik-dashboard-auth"]

# 启用 TLS：不显式指定 certResolver，Traefik v3 默认使用第一个已配置的 DNS resolver
# 自动签发 dashboard 精确域名证书；resolver 池为空时回退自签证书（新增后自动替换）
[http.routers.dashboard.tls]

# 定义 Basic Auth 中间件
[http.middlewares.traefik-dashboard-auth.basicAuth]
  users = [
    "__DASH_BOARD_CREDENTIAL__"
  ]
