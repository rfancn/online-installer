# ============================================================
# Traefik 静态配置
#
# certificatesResolvers 属于「静态配置」，不能放进 file provider 的
# 动态配置目录，因此统一写在本文件，由 --configFile 加载。
# 本文件无占位符：DNS resolver 段在安装/配置时动态追加。
# ============================================================

[log]
  level = "INFO"

[api]
  dashboard = true      # 开启 Dashboard 功能
  insecure = false      # 关闭不安全的默认访问

# --- 入口点 (EntryPoints) ---
[entryPoints.web]
  address = ":80"

  [entryPoints.web.http.redirections.entryPoint]
    to = "websecure"
    scheme = "https"

[entryPoints.websecure]
  address = ":443"

  # --- 大文件上传支持（对应原 nginx 代理调优的取舍结果） ---
  # readTimeout 默认 60s，语义是「读取完整请求（含 body）的最长时间」，
  # 大文件慢上传必然在 60s 被掐断 → 必须显式解除（0 = 不限制，
  # 等价 nginx proxy_request_buffering off + proxy_read_timeout 3000s 的意图）。
  # 其余 nginx 调优均为 Traefik 内建行为/默认值，无需配置：
  #   proxy_set_header Host/X-Forwarded-For/X-Forwarded-Proto → 默认透传 Host、
  #     自动追加 XFF 与 XFP；X-Real-IP 为 nginx 惯例，应用统一读 XFF
  #   proxy_connect_timeout 30s / proxy_send_timeout 60s → dialTimeout 默认 30s、
  #     writeTimeout 默认不限制
  #   proxy_request_buffering/proxy_buffering off → 请求与响应默认流式转发不缓冲
  #   proxy_http_version 1.1 + Connection "" → 上游固定 HTTP/1.1 且内建连接池复用
  #   client_max_body_size 1024m → 默认对 body 大小无任何限制
  [entryPoints.websecure.transport.respondingTimeouts]
    readTimeout = "0s"

# --- 提供者 (Providers) ---
[providers.docker]
  exposedByDefault = false   # 默认不暴露容器，仅暴露带 labels 的容器

[providers.file]
  directory = "/etc/traefik/dynamic"   # 动态配置目录（dashboard 路由等）
  watch = true

# --- Let's Encrypt 证书解析器（resolver 池，仅 DNS-01） ---
# ACME 统一使用 DNS-01 挑战：一个 resolver 绑定一个 DNS 提供商凭据，
# 泛域名与单域名证书都可签发，因此池内只有
# [certificatesResolvers.<证书域名>@<提供商别名>.acme] 段
# （泛域名如 *.example.com@aliyun，单域名如 app.example.com@aliyun）。
# 本模板初始不含任何 resolver：由业务应用安装（引导）或
# bash run.sh configure traefik 经 common.sh 的 create_resolver() 追加到
# 文件末尾（storage 每 resolver 独立 acme-<resolver名>.json，官方禁止共用存储文件）。
# 具体签哪些域名不在此配置：泛域名/单域名声明随业务应用的 compose labels
# 动态下发，Traefik 自动签发并热加载；resolver 池本身的变更需重启容器生效。
# 池为空期间 Dashboard 走 Traefik 默认自签证书，配置 resolver 并重启后自动替换。
