services:
  notify-bridge:
    image: rfancn/notify-bridge:latest
    container_name: notify-bridge
    restart: unless-stopped
    volumes:
      # 配置只读挂载，与官方 docker run 示例一致
      - ./config.toml:/app/config.toml:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notify-bridge.rule=Host(`${NOTIFY_BRIDGE_HOST}`)"
      - "traefik.http.routers.notify-bridge.entrypoints=websecure"
      - "traefik.http.routers.notify-bridge.tls=true"
      # 证书解析器由 .env 的 NOTIFY_BRIDGE_RESOLVER 提供（traefik resolver 池）
      - "traefik.http.routers.notify-bridge.tls.certResolver=${NOTIFY_BRIDGE_RESOLVER}"
      # 精确域名模式下由 install.sh 删除这两行，Traefik 按 rule 域名自动签发
      - "traefik.http.routers.notify-bridge.tls.domains[0].main=${NOTIFY_BRIDGE_CERT_MAIN}"
      - "traefik.http.routers.notify-bridge.tls.domains[0].sans=${NOTIFY_BRIDGE_CERT_SANS}"
      - "traefik.http.routers.notify-bridge.service=notify-bridge-svc"
      - "traefik.http.services.notify-bridge-svc.loadbalancer.server.port=8080"

networks:
  web:
    external: true